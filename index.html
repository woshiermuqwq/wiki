<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MythicMobs 中文文档</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://unpkg.com/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">
    <p style="text-align:center;padding-top:50px;color:#888;">正在加载文档...</p>
  </div>
  <script>
    window.$docsify = {
      name: 'MythicMobs 中文文档',
      repo: 'woshiermuqwq/wiki',
      basePath: '/wiki/',
      homepage: 'home.md',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: '搜索文档...',
        noData: '未找到结果',
        paths: 'auto'
      },
      themeable: {
        readyTransition : true,
        responsiveTables: true
      }
    }
  </script>
  <script src="https://unpkg.com/docsify@4"></script>
  <script src="https://unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
